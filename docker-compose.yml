# Setup instructions are in README.md
services:
  cf-dns-updater:
    container_name: cf-dns-updater
    build: .
    volumes:
      # Copy config.example.json to config.json and fill it in before starting.
      - ./config.json:/app/config.json:ro
    environment:
      - CONFIG_FILE=/app/config.json
      # Optional: supply the token here (or via a .env file) instead of in config.json.
      # - CF_API_TOKEN=${CF_API_TOKEN}
    restart: unless-stopped
